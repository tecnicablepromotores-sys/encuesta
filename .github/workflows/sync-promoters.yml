name: Sync Promoters to Public Collection

on:
  schedule:
    - cron: '0 * * * *'   # Cada hora (cambia a '0 6 * * *' para 6 AM diario)
  workflow_dispatch:      # Botón "Run workflow" en la pestaña Actions

permissions:
  contents: read

jobs:
  sync-promoters:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: scripts

      - name: Sync promotores públicos
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node sync-promoters.js
        working-directory: scripts
